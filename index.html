<script>
           //A <script> contains JavaScript instructions. The browser executes the JavaScript inside it.
                const mqttBroker = "wss://3c79cba0cf534b5fad17f88c1e1eb6c1.s1.eu.hivemq.cloud:8884/mqtt";
  // HiveMQ username
                const mqttUsername = "esp32";
                const mqttPassword = "estonvincentchege";
  
    // Connect to HiveMQ
                 const client = mqtt.connect(mqttBroker, {     // First; Starts the mqtt connection 
                 username: mqttUsername,
                 password: mqttPassword,
                 clientId: "Dashboard_" + Math.random().toString(16).substring(2)
                });

// =================================================
// WHEN CONNECTED       https://chatgpt.com/c/6a9691bb-c42c-83ea-84e6-3b7fe7120d90
// =================================================
    client.on("connect", function() {          
    console.log("Connected to HiveMQ Cloud");
    // Subscribe to ESP32 data
    client.subscribe("esp32/data");
    });

// =================================================
// RECEIVE DATA FROM ESP32 esp32
// =================================================
client.on("message", function(topic, message) {
if (topic === "esp32/data") {
  // Convert MQTT message to normal text
  let data = message.toString();
  console.log("Received:", data);
  // Your ESP32 sends:
  //
  // 1,30,37
  //
  // so split it at commas.
  let values = data.split(",");
  document.getElementById("counter").textContent = values[0];
  document.getElementById("temp").textContent = values[1];
  document.getElementById("hum").textContent = values[2];
  document.getElementById("pmp").textContent = values[3];
  document.getElementById("lmp").textContent = values[4];
  document.getElementById("hmd").textContent = values[5];

      // Change pad colors according to status
    document.getElementById("pumpPad").style.backgroundColor = values[3] === "ON" ? "orange" : "grey";
        //values[3] → take the 4th value received from MQTT.
        //=== "ON" → check whether that value is exactly ON.
        //? "green" → if it is ON, make the pad green.
        //: "red" → otherwise, make it red.
    document.getElementById("lampPad").style.backgroundColor = values[4] === "ON" ? "orange" : "grey";
    document.getElementById("humidifierPad").style.backgroundColor = values[5] === "ON" ? "orange" : "grey";
}
});  

// =================================================
// SEND ON / OFF TO ESP32
// =================================================
function sendCommand(cmd) {
client.publish(
  "esp32/control",
  cmd
);
console.log("Sent:", cmd);
}
</script>
