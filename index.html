  <button onclick="sendCommand('PUMPON')" style="background-color: rgb(11, 206, 53); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;"> Pump ON

  </button>

   &nbsp;&nbsp;&nbsp;			<!-- space foward -->

  </button>

    <br>

  <button onclick="sendCommand('ALARMON')" style="background-color: rgb(45, 0, 128); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;"> Alarm ON
  </button>

   &nbsp;&nbsp;&nbsp;			<!-- space foward -->

  </button>

  <br>
  <br>
  
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  //const ws = new WebSocket("ws://192.168.100.106:81/");  
  
        const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

        const pub_topic = "chege123/home/control";
        const sub_topic = "chege123/home/data";

        client.on("connect", () => {
        console.log("Connected");
        client.subscribe(sub_topic);
        });

        client.on("message", (topic, message) => {
        let data = message.toString().split(",");

        document.getElementById("counter").textContent = data[0];
        document.getElementById("temp").textContent = data[1];
        document.getElementById("hum").textContent = data[2];
        });

        function sendCommand(cmd) {
        client.publish(pub_topic, cmd);
        }
    </script>
</body>
